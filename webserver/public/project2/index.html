<head>
    <title>A Day</title>
    <link href="style.css" rel="stylesheet">
    <script src="main.js"></script>
</head>

<body>
    <div class="day">
        <div id="sun">
            <img src="visuals/sun.png" alt="sun" width="100px" >
        </div>

        <div id="moon">
        <img src="visuals/moon.png" alt="moon" width="100px" >
        </div>

        <div class="street"></div>

        <div>
            <img src="visuals/lamp.png" width ="250px" alt="street lamp" id="lamp">
            <div id="lightbulb"></div>
        </div>

        <div id="apartment1"></div>
        <div id="apartment2"></div>
        <div id="apartment3"></div>

        <!-- creating apartment windows using grid system-->
        <div class="windows">
            <div id="a1"></div>
            <div id="a2"></div>
            <div id="a3"></div>
            <div id="a4"></div>
            <div id="a5"></div>
            <div id="a6"></div>
            <div id="a7"></div>
            <div id="a8"></div>
        </div>

        <div id="message">
            <p>Hey, I should probably go back to work...</p>
        </div>

    </div>

    



</body>
