<html>
<!-- Q: What type of content goes inside the <head>? 
    Does it show up on the webpage? -->
<!-- A: Webpage title and other content that will not show up on the webpage, such as stylesheet for CSS file-->

<head>
    <title>class 8 demo 😌</title>
    <link href="style.css" rel="stylesheet"/>
    <!-- linking JS file using <srcipt> -->
     <script src="main.js"></script>
</head>

<!-- Q: What type of content goes inside the <body>? 
    Does it show up on the webpage? -->
<!-- A: All content one want to show on the webpage, like texts and images-->
 <!-- A: These content will show up on the webpage-->

<body>

    <p>this is a paragraph</p>
    <!-- attributes, such as src for images, href for links -->
    <p class="blue">this is a second paragraph</p>
    <p id="main">this is a third paragraph</p>

    <!-- Can be applied if the same style is applied multiple times -->
    <!-- both classes and id can be added to the same element -->
    <div class="blue" id="blue-div">
        This is a blue div
    </div>

    <!-- now open up style.css -->
</body>

</html>
